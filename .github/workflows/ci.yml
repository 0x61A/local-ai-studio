name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    # Uc platform: sunucu kodu her ucunde de calisacak, testler her ucunde
    # de gecmeli. Donanim tespiti ve surec yonetimi platform basina ayri
    # dallar kullaniyor -- yalnizca macOS'ta kosmak onlari korumasiz birakir.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
